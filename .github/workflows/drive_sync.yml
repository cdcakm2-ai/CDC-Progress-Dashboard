name: Automatic Google Drive Sync

on:
  schedule:
    # Runs every 6 hours automatically (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows 1-click manual trigger anytime from the GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Fetch Google Drive updates & compile canonical data
        run: |
          python scripts/auto_drive_sync_once.py

      - name: Check for data changes
        id: git-check
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updates to GitHub Pages
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(sync): auto-update dashboard from Google Drive [skip ci]"
          git push origin main
